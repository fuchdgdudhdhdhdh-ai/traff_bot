services:
  - type: web
    name: telegram-referral-bot-v4
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPERADMIN_IDS
        sync: false
      - key: PUBLIC_CHANNEL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: PRIVATE_URL
        sync: false
